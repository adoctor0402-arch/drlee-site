name: 星際觀測站 — 抓取新論文

# 2026-10-16：自動排程停用，只留手動觸發。
#
# 原因：抓論文有兩條管線同時寫進 content/observatory/，這一條用 PMID 當檔名，
# 每日排程的 new-paper.mjs 用自訂代號，所以同一篇研究被收過兩次
# （42567929 與 natmed-dnm-art-2026 都是那篇 Nature Medicine 的新生突變研究）。
#
# 留下的是每日排程那一條，因為它會回原始論文核對再寫中文，這一條不查核、
# 產出的是英文骨架，堆在草稿區還是要有人從零開始讀。
#
# 這一條原本獨有的覆蓋範圍（NEJM、Lancet、JAMA、BMJ、Nat Med、Hum Reprod Open、
# Human Fertility、Reprod Biol Endocrinol）已經補進上游的「Top journal daily digest」
# 排程，綜合期刊那幾本有加主題條件，不然會塞滿別科的論文。
#
# 補不回來的是 30 天回溯。這一條往回看 30 天會撿到索引延遲的論文，
# 每日摘要只查前一天。想補那段空窗的時候，到 GitHub 的 Actions 分頁手動按
# Run workflow 就會跑一次，不會自動跑。
on:
  workflow_dispatch: {} # 只能手動觸發

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 這一步只抓論文、建立骨架，不產生任何中文內容。
      # 中文標題與重點由每週審稿流程查核原始論文後撰寫，見 scripts/weekly-review.md。
      - name: 抓取 PubMed 新論文
        run: node scripts/fetch-papers.mjs

      - name: 把待審核的論文存回 repo
        run: |
          git config user.name "observatory-bot"
          git config user.email "noreply@github.com"
          git add content/observatory
          git diff --staged --quiet && echo "沒有新論文" && exit 0
          git commit -m "星際觀測站：新增待審核論文 $(date +%Y-%m-%d)"
          git push
